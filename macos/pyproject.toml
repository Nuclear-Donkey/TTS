[project]
name = "voice-input-macos"
version = "0.1.0"
description = "macOS voice input — Chinese-first, local Paraformer"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "zs" }]

# Frozen: focus is on Windows. macOS code compiles but has not been
# tested end-to-end on actual hardware.

dependencies = [
    "sherpa-onnx>=1.10.0",
    "numpy>=1.26",
    "sounddevice>=0.4.7",
    "pynput>=1.7.6",
    "pyperclip>=1.9.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-ApplicationServices>=10.0",
]

[project.scripts]
voice-input-macos = "voice_input_macos.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_input_macos", "src/shared"]
