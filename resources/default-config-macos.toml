# voice-input-macos configuration
# Location: ~/Library/Application Support/voice-input/config.toml

[hotkey]
# Push-to-talk key. pynput key names:
#   "right_option"  — default, safe, rarely conflicts
#   "left_option"   — may conflict with shortcuts
#   "right_cmd"     — safe but unusual
#   "f9" / "f12"    — function keys, no conflicts
#   "caps_lock"     — NOT RECOMMENDED on macOS: it's a toggle key, so
#                     pynput won't fire a release when you let go.
#                     If you really want it, disable Caps Lock toggle in
#                     System Settings > Keyboard > Keyboard Shortcuts >
#                     Modifier Keys first.
ptt = "right_option"

[audio]
# sounddevice device identifier. Empty = system default input.
# List devices: python3 -c "import sounddevice; print(sounddevice.query_devices())"
device = ""
sample_rate = 16000

[stt]
# model_dir = "~/Library/Application Support/voice-input/models/paraformer-zh"
num_threads = 4

[inject]
# "paste"       — clipboard + Cmd+V via pynput (recommended)
# "applescript" — clipboard + Cmd+V via osascript System Events (slower)
# Both methods require Accessibility permission for the running process;
# there is no permission-free way to paste on modern macOS.
method = "paste"
restore_clipboard = true
paste_delay = 0.08
