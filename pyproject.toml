[project]
name = "voice-ibus"
version = "0.1.0"
description = "IBus voice input method for Linux (Wayland) — Chinese-first, local Paraformer"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "zs" }]

dependencies = [
    "sherpa-onnx>=1.10.0",
    "numpy>=1.26",
]
# Audio capture uses `arecord` (alsa-utils) via subprocess — avoids portaudio sudo install
# and routes through PipeWire transparently on GNOME/Ubuntu.

[project.scripts]
voice-ibus = "voice_ibus.__main__:main"
voice-input-win = "voice_input_win.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Windows-only deps. `pip install -e ".[win]"` on Windows pulls these.
win = [
    "sounddevice>=0.4.7",
    "keyboard>=0.13.5",
    "pyperclip>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_ibus", "src/voice_input_win"]

[tool.uv]
# PyGObject / IBus bindings come from system site-packages (python3-gi, python3-ibus-1.0).
# Create the venv with --system-site-packages for this to work:
#   uv venv --system-site-packages
