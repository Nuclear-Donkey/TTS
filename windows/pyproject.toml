[project]
name = "voice-input-win"
version = "0.2.0"
description = "Windows voice input — hold Caps Lock to dictate (Paraformer-zh, local)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "zs" }]

dependencies = [
    "sherpa-onnx>=1.10.0",
    "numpy>=1.26",
    "sounddevice>=0.4.7",
    "keyboard>=0.13.5",
    "pyperclip>=1.9.0",
    "PySide6>=6.6",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.0",
    "Pillow>=10.0",
    "pywin32>=306",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
voice-input-win = "voice_input_win.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `shared/` is copied into src/ by scripts/install.bat (see sync_shared step)
# before `pip install -e .` runs, so hatchling sees it as a sibling package.
[tool.hatch.build.targets.wheel]
packages = ["src/voice_input_win", "src/shared"]
